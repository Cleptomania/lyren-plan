# Deploys the fork it runs in to the Cloudflare account in the secrets of its "cloudflare" environment: Actions
# -> Deploy to Cloudflare -> Run workflow. Usable unchanged by any fork that commits its instance configuration;
# this repository itself has none, and never deploys through it. See docs/cloudflare.md, step 4B, and "Your
# instance configuration".
#
#   dry_run checked (default)   check the instance configuration, build and test, then `wrangler deploy
#                               --dry-run` with it: the Worker is bundled and its configuration checked;
#                               nothing is uploaded and no Cloudflare token or app secret is used
#   dry_run unchecked           the same, then a new version of the Worker made from the instance
#                               configuration, with the app's secrets, which are uploaded with it (so it
#                               never runs without them)
#
# A fork sets it up once:
#   The instance configuration: the settings of the fork's Worker (its name, custom domains, variables, the
#               secrets it needs), never a secret's value. Copy wrangler.instance.example.jsonc to
#               wrangler.instance.jsonc at the root, edit it and commit it (git add -f, since .gitignore lists
#               it, or GitHub's Add file), or commit it elsewhere and name its path in the repository variable
#               LYREN_INSTANCE_FILE (Settings -> Secrets and variables -> Actions -> Variables; a repository
#               variable, which the check job reads too). It goes on the branch the environment deploys: the
#               fork's default branch, or, in a fork that also sends pull requests, a branch of its own (deploy,
#               say), so that the default branch and pull requests never carry it. A public fork publishes it.
#               scripts/cf/wrangler.mjs lays it over wrangler.jsonc for each run; without one, the check job
#               fails.
#   Settings -> Environments -> cloudflare (deployment branch: the branch that holds the instance
#               configuration; required reviewers):
#   secrets     CLOUDFLARE_API_TOKEN (a custom token from the "Edit Cloudflare Workers" template, for this
#               one account), CLOUDFLARE_ACCOUNT_ID; optionally SETUP_TOKEN, SMTP_USER, SMTP_PASS,
#               MAIL_REPLY_TO, RESEND_API_KEY (never one the instance configuration has as a variable).
#               Environment secrets, not repository secrets: those reach every workflow in the repository,
#               one written by anybody who can push a branch included, with no approval.
# RECOVERY_TOKEN is never part of it: set it by hand only while you need it (docs/cloudflare.md, "Locked out").
#
# Security: like release.yml, the token can only read; only GitHub's own actions, each pinned to the
# commit of a release (the same as release.yml's); no caches; no pull_request_target; text that someone
# else chooses reaches scripts through environment variables, never through ${{ }} in a script. No
# third-party code shares a runner with a secret: the check job checks the instance configuration and runs
# npm run check (Vite, its plugins, the test suites) with none, and hands on only the built web client; the
# deploy job, on a new runner, installs without install scripts, writes the app's secrets to a private file
# with node -e alone, and runs scripts/cf/wrangler.mjs, which runs only the app's own configuration parser
# (bundled by Wrangler's esbuild, and refused if it imports a package) and Wrangler, with the Cloudflare
# token but no app secret in its environment (LYREN_PREBUILT=1: no Vite in that step). The dry run gets no
# token at all.

name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only build and validate (wrangler deploy --dry-run); nothing is deployed
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (the exact version in .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # A missing or bad instance configuration stops here, before anybody approves the deploy job.
      - name: Check the instance configuration (no secrets in this job)
        env:
          LYREN_INSTANCE_FILE: ${{ vars.LYREN_INSTANCE_FILE }}
        run: node scripts/cf/wrangler.mjs --validate

      - name: Typecheck, test and build (no secrets in this job)
        run: npm run check

      - name: Keep the web client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: dist/web
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: ${{ inputs.dry_run && 'Dry run' || 'Deploy' }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job with the environment's secrets: its deployment branch (the branch that holds the instance
    # configuration) and required reviewers decide.
    environment: cloudflare
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (the exact version in .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Wrangler and what it bundles; no install script runs. Before Wrangler, only the app's own configuration
      # parser runs (scripts/lib/app-config.mjs).
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download the web client
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web
          path: dist/web

      - name: Write the app secrets to a private file
        if: ${{ !inputs.dry_run }}
        env:
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: bash scripts/ci/write-secrets-file.sh "$RUNNER_TEMP/lyren-secrets.json"

      # The instance configuration, checked again and laid over wrangler.jsonc, then Wrangler. The dry run
      # needs no token and gets none.
      - name: Dry run
        if: ${{ inputs.dry_run }}
        env:
          LYREN_PREBUILT: '1'
          LYREN_INSTANCE_FILE: ${{ vars.LYREN_INSTANCE_FILE }}
        run: node scripts/cf/wrangler.mjs deploy --dry-run --outdir dist/worker

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LYREN_PREBUILT: '1'
          LYREN_INSTANCE_FILE: ${{ vars.LYREN_INSTANCE_FILE }}
        run: node scripts/cf/wrangler.mjs deploy --secrets-file="$RUNNER_TEMP/lyren-secrets.json"

      - name: Remove the secrets file
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/lyren-secrets.json"
